services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dhaka-tesla-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=dhaka-tesla-production-secret-jwt-key
      - DB_FILE=/app/data/dhaka_tesla.sqlite
    volumes:
      - dhaka_tesla_db:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dhaka-tesla-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  dhaka_tesla_db:
    name: dhaka_tesla_db
